<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background: #222;
            color: #fff;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar h2 {
            margin-top: 0;
        }
        .sidebar a {
            color: #00ccff;
            text-decoration: none;
            display: block;
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }
        .sidebar a:hover {
            color: #33ddff;
        }
        .content {
            flex: 1;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000; /* dunkler Hintergrund wie deine Apps */
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Apps</h2>

        <a onclick="openHome()">Home</a>

        <a onclick="openPage('quadratzahlen_quiz_v3.html')">Quadratzahlen-Quiz v3</a>

        <!-- <a onclick="openPage('quadratzahlen_quiz_v4.html')">Quadratzahlen-Quiz v4</a> -->

    </div>

    <div class="content">
        <iframe id="contentFrame" src="home.html"></iframe>
    </div>

    <script>
        function openPage(page) {
            document.getElementById('contentFrame').src = page;
        }
        function openHome() {
            document.getElementById('contentFrame').src = "home.html";
        }
    </script>

</body>
</html>
