<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>Apps</title>

<style>
    :root {
        --bg: #000;
        --text: #fff;
        --sidebar-bg: rgba(30,30,30,0.85);
        --accent: #00ccff;
        --accent2: #00ff99;
        --glow: rgba(0,200,255,0.6);
    }

    body.light {
        --bg: #fafafa;
        --text: #000;
        --sidebar-bg: rgba(255,255,255,0.75);
        --accent: #0088ff;
        --accent2: #00aa55;
        --glow: rgba(0,140,255,0.4);
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, Arial, sans-serif;
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
        width: 260px;
        background: var(--sidebar-bg);
        backdrop-filter: blur(12px);
        padding: 20px;
        height: 100%;
        box-sizing: border-box;
        border-right: 1px solid rgba(255,255,255,0.15);
        transition: transform 0.3s ease, background 0.3s ease;
        z-index: 100;
    }

    .sidebar h2 {
        margin-top: 0;
        font-size: 28px;
        text-shadow: 0 0 15px var(--glow);
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        color: var(--accent);
        text-decoration: none;
        margin: 14px 0;
        cursor: pointer;
        transition: 0.25s;
    }

    .sidebar a:hover {
        transform: translateX(6px);
        color: var(--accent2);
    }

    .icon {
        width: 22px;
        height: 22px;
    }

    /* LIGHT/DARK TOGGLE */
    .mode-toggle {
        margin-top: 40px;
        padding: 10px 14px;
        background: var(--accent);
        color: #000;
        border-radius: 10px;
        border: none;
        width: 100%;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 14px var(--glow);
        transition: 0.2s;
    }

    /* CONTENT */
    .content {
        flex: 1;
        height: 100vh;
        position: relative;
        overflow: hidden;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #000;
    }

    /* MOBILE BURGER */
    .burger {
        display: none;
        position: absolute;
        top: 15px;
        left: 15px;
        background: var(--sidebar-bg);
        padding: 12px 15px;
        font-size: 24px;
        border-radius: 8px;
        z-index: 200;
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(12px);
        cursor: pointer;
    }

    @media (max-width: 900px) {

        /* Sidebar ausblenden */
        .sidebar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transform: translateX(-100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .burger {
            display: block;
        }
    }

</style>

</head>
<body>

<!-- MOBILE BURGER MENU -->
<div class="burger" onclick="toggleSidebar()">☰</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <h2>Apps</h2>

    <!-- Home-Link -->
    <a onclick="openHome()">
        <svg class="icon" viewBox="0 0 24 24">
            <path fill="currentColor"
                  d="M12 3l10 9h-3v9h-6v-6H11v6H5v-9H2z"/>
        </svg>
        Home
    </a>

    <!-- Ultra Desktop Quiz -->
    <a onclick="openPage('quadratzahlen_quiz_v3.html')">
        <svg class="icon" viewBox="0 0 24 24">
            <path fill="currentColor"
                d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2m7 7h5v2h-5m0 4h5v2h-5M7 7h10v2H7m0 4h4v2H7m0 4h4v2H7z"/>
        </svg>
        Quadratzahlen-Quiz v3
    </a>

    <!-- Dark/Light -->
    <button class="mode-toggle" onclick="toggleMode()">
        🌙 / ☀️  Modus wechseln
    </button>
</div>

<!-- CONTENT AREA -->
<div class="content">
    <!-- Standard Startseite -->
    <iframe id="contentFrame" src="home.html"></iframe>
</div>

<script>
/* SIDEBAR MOBILE */
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
}
function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
}

/* NAVIGATION */
function openHome() {
    document.getElementById("contentFrame").src = "home.html";
    closeSidebar();
}
function openPage(page) {
    document.getElementById("contentFrame").src = page;
    closeSidebar();
}

/* LIGHT / DARK MODE */
function toggleMode() {
    document.body.classList.toggle("light");
}
</script>

</body>
</html>
