<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Zahlencode-Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1f2937;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      padding: 24px 20px;
      width: 100%;
      max-width: 700px; /* mehr Breite nutzbar */
    }

    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 0.75rem 0;
      font-size: 1rem;
      line-height: 1.4;
      color: #9ca3af;
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    .row {
      display: flex;
      flex-wrap: wrap;       /* bricht um, wenn es eng wird */
      gap: 8px;
      margin-bottom: 0.75rem;
    }

    input {
      flex: 1 1 120px;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 1.1rem;
    }

    input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 0 1px #60a5fa40;
    }

    button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #022c22;
      white-space: nowrap;
    }

    button:active {
      transform: translateY(1px);
    }

    .secondary-btn {
      background: #1f2937;
      color: #e5e7eb;
    }

    .result {
      margin-top: 0.75rem;
      padding: 10px 12px;
      border-radius: 10px;
      background: #020617;
      border: 1px dashed #374151;
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 1.8rem;       /* deutlich größer */
      text-align: center;       /* zentriert */
      word-break: break-all;
    }
  </style>
  <script>
    function berechneCode() {
      const inputEl = document.getElementById("secret");
      const outEl = document.getElementById("result");
      const input = (inputEl.value || "").trim();

      // genau 4 Ziffern 0–9
      if (!/^[0-9]{4}$/.test(input)) {
        outEl.textContent = "Bitte genau 4 Ziffern von 0 bis 9 eingeben (z. B. 1234).";
        return;
      }

      const a = Number(input[0]);
      const b = Number(input[1]);
      const c = Number(input[2]);
      const d = Number(input[3]);

      // 11 Ausgabestellen, nur mit + und mod 10
      const D1  = (a + 6) % 10;
      const D2  = (b + 1) % 10;
      const D3  = (c + 2) % 10;
      const D4  = (d + 0) % 10;
      const D5  = (a + b + 3) % 10;
      const D6  = (b + c + 0) % 10;
      const D7  = (c + d + 1) % 10;
      const D8  = (a + d + 5) % 10;
      const D9  = (a + 4) % 10;
      const D10 = (b + 0) % 10;
      const D11 = (c + 3) % 10;

      const code11 = "" +
        D1 + D2 + D3 + D4 +
        D5 + D6 + D7 + D8 +
        D9 + D10 + D11;

      outEl.textContent = code11;
    }

    function clearCode() {
      document.getElementById("secret").value = "";
      document.getElementById("result").textContent = "";
      document.getElementById("secret").focus();
    }

    document.addEventListener("DOMContentLoaded", function () {
      const inputEl = document.getElementById("secret");
      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          berechneCode();
        }
      });
      inputEl.focus();
    });
  </script>
</head>
<body>
  <div class="card">
    <h1>Zahlencode-Generator</h1>
    <p>
      Gib einen 4-stelligen Code ein, um eine 11-stellige Zahl zu erzeugen.
      Die Berechnung erfolgt ausschließlich im Browser.
    </p>

    <label for="secret">Code (4 Ziffern, 0–9):</label>
    <div class="row">
      <input id="secret"
             maxlength="4"
             inputmode="numeric"
             autocomplete="off"
             placeholder="z. B. 1234">
      <button type="button" onclick="berechneCode()">Berechnen</button>
    </div>

    <div class="row" style="justify-content: flex-end; margin-top: -4px;">
      <button type="button" class="secondary-btn" onclick="clearCode()">
        Löschen
      </button>
    </div>

    <div class="result" id="result"></div>
  </div>
</body>
</html>
