<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Home</title>

<style>
    body {
        background: #000;
        color: #fff;
        margin: 0;
        overflow: hidden; /* kein Scrollen */
        font-family: -apple-system, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        touch-action: none;
    }

    /* Haupt-Container wird skaliert wie beim Quiz */
    #homeContainer {
        width: 1000px;      /* Basis */
        height: 1200px;     /* Basis */
        transform-origin: top center;
        position: absolute;
        left: 50%;
        top: 0;
        margin-left: -500px;
    }

    h1 {
        font-size: 3rem;
        color: #00ccff;
        text-shadow: 0 0 20px #00ccff;
        margin-top: 120px;
        animation: glow 2s infinite alternate ease-in-out;
    }

    p {
        font-size: 1.6rem;
        margin-top: 30px;
        color: #ddd;
    }

    @keyframes glow {
        0% { opacity: 0.75; text-shadow: 0 0 20px #00ccff; }
        100% { opacity: 1; text-shadow: 0 0 45px #00ffff; }
    }
</style>
</head>

<body>

<div id="homeContainer">
    <h1>Willkommen!</h1>
    <p>Wähle links eine App aus.</p>
    <p>Quadratzahlen-Quiz v3 ist bereits verfügbar.</p>
</div>

<script>
/* ------------------------------------------------------------
   AUTO-SCALE – exakt dieselbe Logik wie beim Quiz
------------------------------------------------------------ */
function scaleHome() {
    const baseWidth  = 1000;
    const baseHeight = 1200;

    const w = window.innerWidth;
    const h = window.innerHeight;

    const scale = Math.min(w / baseWidth, h / baseHeight);

    document.getElementById("homeContainer").style.transform =
        "scale(" + scale + ")";
}

window.onload = scaleHome;
window.onresize = scaleHome;
window.addEventListener("orientationchange", scaleHome);
</script>

</body>
</html>
