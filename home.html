<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home – Apps</title>
  <style>
    :root {
      --bg-main: #000;
      --text-main: #eee;
      --accent: #00ccff;
    }

    body.light-theme {
      --bg-main: #f4f6fb;
      --text-main: #111;
      --accent: #0059aa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .content {
      max-width: 600px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 2.2rem;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(0, 204, 255, 0.7);
    }

    body.light-theme h1 {
      text-shadow: none;
    }

    p {
      margin: 8px 0;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    /* Toggle-Button */
    #theme-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(10,10,20,0.85);
      color: #ffd86b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
      font-size: 1.4rem;
    }

    body.light-theme #theme-toggle {
      background: rgba(255,255,255,0.95);
      border-color: rgba(0,0,0,0.15);
      color: #ff9800;
    }

    /* kleinere Schrift auf Smartphones */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 1.4rem;
        text-shadow: 0 0 8px rgba(0, 204, 255, 0.7);
      }

      p {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <button id="theme-toggle" aria-label="Day/Night umschalten">☀️</button>

  <div class="content">
    <h1>Willkommen bei deinen Apps2</h1>
    <p>Dies ist deine Startseite.</p>
    <p>Wähle im Menü ein Spiel oder eine App aus, um zu starten.</p>
  </div>

  <script>
    const homeThemeBtn = document.getElementById('theme-toggle');
    let homeLightOn = false;  // false = dunkel, true = hell

    function applyHomeTheme() {
      document.body.classList.toggle('light-theme', homeLightOn);
      // Symbol zeigt das ZIEL: dunkel → ☀️ (zu hell), hell → 🌙 (zu dunkel)
      homeThemeBtn.textContent = homeLightOn ? '🌙' : '☀️';
    }

    homeThemeBtn.addEventListener('click', () => {
      homeLightOn = !homeLightOn;
      applyHomeTheme();
    });

    applyHomeTheme();
  </script>
</body>
</html>
