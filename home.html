<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home – Apps</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;              /* Fix für iOS im iframe */
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #eee;
      display: flex;
      align-items: center;       /* vertikal mittig */
      justify-content: center;   /* horizontal mittig */
      text-align: center;
      padding: 20px;
    }

    .content {
      max-width: 600px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 2.2rem;
      color: #00ccff;
      text-shadow: 0 0 15px #00ccff;
    }

    p {
      margin: 8px 0;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #ddd;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.95rem;
      color: #888;
    }

    /* Deutlich kleinere Schrift auf Smartphones (iPhone) */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 1.4rem;
        text-shadow: 0 0 8px #00ccff;
      }

      p {
        font-size: 0.8rem;
      }

      .hint {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Willkommen bei deinen Apps1</h1>
    <p>Dies ist deine Startseite.</p>
    <p>Wähle im Menü ein Spiel oder eine App aus, um zu starten.</p>
  </div>
</body>
</html>
