<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Einmaleins-Quiz (1×1 bis 10×10)</title>

<style>
  :root {
    --bg-main: #000;
    --text-main: #eee;
    --accent: #00ccff;
    --accent-soft: #00ff99;
    --panel: #111827;
    --panel-soft: #1b2235;
    --button-bg: #0066ff;
    --button-text: #fff;
    --bad: #ff5252;
    --good: #4caf50;
  }

  body.light-theme {
    --bg-main: #f4f6fb;
    --text-main: #111;
    --accent: #0059aa;
    --accent-soft: #00aa66;
    --panel: #ffffff;
    --panel-soft: #e3e7f5;
    --button-bg: #1976d2;
    --button-text: #fff;
    --bad: #e53935;
    --good: #2e7d32;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #02030a, var(--bg-main));
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }

  /* Theme-Toggle */
  #theme-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1200;
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(10,10,20,0.85);
    color: #ffd86b;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,0.6);
    font-size: 1.4rem;
  }

  body.light-theme #theme-toggle {
    background: rgba(255,255,255,0.95);
    border-color: rgba(0,0,0,0.15);
    color: #ff9800;
  }

  /* Gesamter Spielcontainer (wird ggf. später skaliert, wenn nötig) */
  #gameContainer {
    position: relative;
    width: 640px;
    max-width: 100%;
    background: var(--panel);
    border-radius: 20px;
    padding: 18px 18px 24px;
    box-shadow:
      0 0 30px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.04);
  }

  .app-title {
    text-align: center;
    margin-bottom: 10px;
  }

  .app-title h1 {
    margin: 0;
    font-size: 1.8rem;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(0, 204, 255, 0.4);
  }

  .app-title p {
    margin: 4px 0 0;
    font-size: 0.95rem;
    opacity: 0.8;
  }

  /* Startscreen */
  #start {
    text-align: center;
  }

  #start .controls {
    margin-top: 12px;
    padding: 12px;
    border-radius: 14px;
    background: var(--panel-soft);
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .row-label {
    font-size: 0.95rem;
    opacity: 0.9;
    min-width: 90px;
  }

  .row-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .small-btn {
    min-width: 32px;
    padding: 4px 6px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: transparent;
    color: var(--text-main);
    font-size: 0.9rem;
    cursor: pointer;
  }

  .small-btn.active {
    background: var(--accent);
    color: #000;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(0, 204, 255, 0.6);
    font-weight: 600;
  }

  .mode-btn {
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: transparent;
    color: var(--text-main);
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .mode-btn.active {
    background: var(--accent-soft);
    color: #000;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(0, 255, 153, 0.6);
    font-weight: 600;
  }

  .slider {
    width: 260px;
    accent-color: var(--accent-soft);
    -webkit-appearance: none;
    appearance: none;
    height: 18px;
    border-radius: 999px;
    background: #222;
    outline: none;
  }

  body.light-theme .slider {
    background: #cfd8e6;
  }

  .slider::-webkit-slider-runnable-track {
    height: 10px;
    background: transparent;
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 10px var(--accent-soft);
    border: none;
    margin-top: -8px;
  }

  .slider::-moz-range-track {
    height: 10px;
    background: transparent;
  }

  .slider::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 10px var(--accent-soft);
    border: none;
  }

  .slider-info {
    font-size: 1.1rem;
    opacity: 0.9;
    font-weight: bold;
  }

  .start-big {
    margin-top: 16px;
    padding: 18px 40px;
    border-radius: 15px;
    border: none;
    background: var(--accent);
    color: #000;
    cursor: pointer;
    font-weight: 700;
    font-size: 1.4rem;
    box-shadow: 0 0 20px rgba(0, 204, 255, 0.5);
  }

  /* Game Screen */
  #game {
    display: none;
  }

  .stats {
    font-size: 0.95rem;
    margin-bottom: 10px;
  }

  .stats span {
    margin-right: 8px;
  }

  .stat-good { color: var(--good); }
  .stat-bad  { color: var(--bad); }

  .question {
    text-align: center;
    margin: 12px 0 14px;
    font-size: 1.6rem;
  }

  .question strong {
    font-size: 1.9rem;
    color: var(--accent);
  }

  .dropzone {
    width: 420px;
    max-width: 100%;
    height: 150px;
    margin: 16px auto 18px;
    border: 3px dashed var(--accent);
    border-radius: 20px;
    background: #eef3ff;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-size: 1.1rem;
    text-align: center;
    box-shadow:
      0 0 25px rgba(0,200,255,0.4),
      0 0 0 3px rgba(0,0,0,0.5) inset;
  }

  body.light-theme .dropzone {
    box-shadow:
      0 0 18px rgba(0,0,0,0.15),
      0 0 0 1px rgba(0,0,0,0.06) inset;
  }

  .dropzone.empty-text::before {
    content: "Ziehe das richtige Ergebnis hierher";
    opacity: 0.9;
  }

  #feedback {
    position: relative;
    z-index: 2;
  }

  .btn-answer {
    width: 96px;
    height: 72px;
    margin: 6px;
    background: var(--button-bg);
    color: var(--button-text);
    font-size: 1.3rem;
    border-radius: 12px;
    border: none;
    font-weight: bold;
    cursor: grab;
    touch-action: none;
    box-shadow: 0 4px 15px rgba(0,100,255,0.6);
  }

  body.light-theme .btn-answer {
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }

  .btn-answer:active { transform: scale(0.95); }

  .answers-container {
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .answers-row {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
  }

  .drag-ghost {
    position: absolute;
    pointer-events: none;
    z-index: 9999;
    padding: 18px 28px;
    border-radius: 12px;
    background: var(--button-bg);
    color: var(--button-text);
    font-size: 1.4rem;
    opacity: 0.9;
    box-shadow: 0 0 30px var(--accent);
    font-weight: bold;
    transform: translate(-50%, -50%);
  }

  .success {
    font-size: 3.2rem;
    color: var(--good);
    text-shadow: 0 0 14px rgba(0,255,153,0.6);
    animation: pop 0.9s;
  }

  .fail {
    font-size: 3.2rem;
    color: var(--bad);
    text-shadow: 0 0 10px rgba(255,82,82,0.6);
    animation: shake 0.6s;
  }

  @keyframes pop {
    0% { transform: scale(0) }
    70% { transform: scale(1.4) }
    100% { transform: scale(1) }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0) }
    20%,60% { transform: translateX(-16px) }
    40%,80% { transform: translateX(16px) }
  }

  .finished {
    margin-top: 10px;
    text-align: center;
    font-size: 1rem;
  }

  .finished strong {
    color: var(--accent-soft);
  }

  @media (max-width: 600px) {
    #gameContainer {
      padding: 14px 10px 16px;
      border-radius: 16px;
    }

    .app-title h1 {
      font-size: 1.5rem;
    }

    .question {
      font-size: 1.4rem;
    }

    .question strong {
      font-size: 1.7rem;
    }

    .btn-answer {
      width: 80px;
      height: 64px;
      font-size: 1.1rem;
    }
  }
</style>
</head>
<body>

<button id="theme-toggle" aria-label="Day/Night umschalten">☀️</button>

<div id="gameContainer">
  <div class="app-title">
    <h1>Einmaleins-Quiz</h1>
    <p>Klasse 4 · 1×1 bis 10×10 · Drag &amp; Drop</p>
  </div>

  <!-- STARTSCREEN -->
  <div id="start">
    <p style="font-size:1.6rem; font-weight:bold; margin-top:4px;">
      Anzahl Fragen:
      <span id="anzahl" style="color:var(--accent-soft);">10</span>
    </p>
    <input type="range" min="1" max="20" value="10" class="slider" id="slider">

    <div class="controls">
      <!-- Malreihe wählen -->
      <div class="row">
        <div class="row-label">Malreihe:</div>
        <div class="row-buttons" id="row-buttons"></div>
      </div>

      <!-- Modus & Zufall -->
      <div class="row" style="margin-bottom:0;">
        <div class="row-label">Modus:</div>
        <div class="row-buttons">
          <button type="button" id="btn-mode-row" class="mode-btn active">
            Nur gewählte Malreihe
          </button>
          <button type="button" id="btn-mode-all" class="mode-btn">
            Alle 1×1 durcheinander
          </button>
          <button type="button" id="btn-random-row" class="mode-btn">
            🔀 Zufall (Malreihe)
          </button>
        </div>
      </div>
    </div>

    <button class="start-big" id="btn-start">Los geht’s!</button>
  </div>

  <!-- SPIEL -->
  <div id="game">
    <div class="stats">
      <span>Frage <strong id="stat-question">0</strong>/<span id="stat-total">0</span></span>
      <span class="stat-good">✅ <span id="stat-correct">0</span></span>
      <span class="stat-bad">❌ <span id="stat-wrong">0</span></span>
      <span>⏱ <span id="stat-time">0</span>s</span>
    </div>

    <div class="question" id="question">
      Klicke auf „Los geht’s!“ um zu beginnen.
    </div>

    <div class="dropzone empty-text" id="dropzone">
      <div id="feedback"></div>
    </div>

    <div class="answers-container" id="answers">
      <!-- 2 Reihen à 5 Buttons -->
    </div>

    <div class="finished" id="finished" style="display:none;"></div>
  </div>
</div>

<script>
/* Theme-Toggle */
const themeBtn = document.getElementById('theme-toggle');
let lightOn = false; // false = dunkel, true = hell

function applyTheme() {
  document.body.classList.toggle('light-theme', lightOn);
  themeBtn.textContent = lightOn ? '🌙' : '☀️';
}

themeBtn.addEventListener('click', () => {
  lightOn = !lightOn;
  applyTheme();
});

applyTheme();

/* DOM-Referenzen */
const sliderEl      = document.getElementById('slider');
const anzahlEl      = document.getElementById('anzahl');
const startScreen   = document.getElementById('start');
const gameScreen    = document.getElementById('game');
const rowButtonsDiv = document.getElementById('row-buttons');

const btnModeRow    = document.getElementById('btn-mode-row');
const btnModeAll    = document.getElementById('btn-mode-all');
const btnRandomRow  = document.getElementById('btn-random-row');
const btnStart      = document.getElementById('btn-start');

const statQuestion  = document.getElementById('stat-question');
const statTotal     = document.getElementById('stat-total');
const statCorrect   = document.getElementById('stat-correct');
const statWrong     = document.getElementById('stat-wrong');
const statTime      = document.getElementById('stat-time');

const questionEl    = document.getElementById('question');
const dropzoneEl    = document.getElementById('dropzone');
const feedbackEl    = document.getElementById('feedback');
const answersDiv    = document.getElementById('answers');
const finishedEl    = document.getElementById('finished');

/* Zustand */
let totalQuestions = 10;
let currentQuestionNr = 0;
let correctCount = 0;
let wrongCount   = 0;

let currentA = 0;
let currentB = 0;
let currentProduct = 0;

let modeAll   = false; // false = nur Malreihe
let randomRow = false; // true = Reihenfolge durcheinander
let currentRow = 5;    // Start: 5er Reihe

let seqIndex = 0;      // für chronologische Reihe (b = 1..10)
let quizRunning = false;

let startTime = 0;
let timerId   = null;

/* Slider */
sliderEl.addEventListener('input', () => {
  anzahlEl.textContent = sliderEl.value;
});

/* Malreihen-Buttons 1..10 */
function createRowButtons() {
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'small-btn' + (i === currentRow ? ' active' : '');
    btn.textContent = i.toString();
    btn.dataset.row = i.toString();
    btn.addEventListener('click', () => {
      currentRow = i;
      updateRowButtons();
    });
    rowButtonsDiv.appendChild(btn);
  }
}

function updateRowButtons() {
  Array.from(rowButtonsDiv.children).forEach(btn => {
    const n = parseInt(btn.dataset.row, 10);
    btn.classList.toggle('active', n === currentRow);
  });
}

function updateModeButtons() {
  btnModeRow.classList.toggle('active', !modeAll);
  btnModeAll.classList.toggle('active', modeAll);
  btnRandomRow.classList.toggle('active', randomRow && !modeAll);
}

/* Modus-Buttons */
btnModeRow.addEventListener('click', () => {
  modeAll = false;
  updateModeButtons();
});

btnModeAll.addEventListener('click', () => {
  modeAll = true;
  updateModeButtons();
});

btnRandomRow.addEventListener('click', () => {
  if (modeAll) return; // Zufall-Reihenfolge nur im Malreihen-Modus
  randomRow = !randomRow;
  updateModeButtons();
});

/* Helper */
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* Neue Frage generieren */
function generateQuestion() {
  if (modeAll) {
    // Alle 1×1 durcheinander
    currentA = 1 + Math.floor(Math.random() * 10);
    currentB = 1 + Math.floor(Math.random() * 10);
  } else {
    // Nur eine Malreihe
    currentA = currentRow;
    if (randomRow) {
      currentB = 1 + Math.floor(Math.random() * 10);
    } else {
      // chronologisch b=1..10
      seqIndex = (seqIndex % 10) + 1;
      currentB = seqIndex;
    }
  }
  currentProduct = currentA * currentB;
}

/* Antwort-Buttons (10 Stück, 2 Reihen à 5) bauen */
function buildAnswerButtons() {
  answersDiv.innerHTML = '';

  const values = new Set();
  values.add(currentProduct);

  while (values.size < 10) {
    const delta = (Math.floor(Math.random() * 21) - 10) || 1;
    let cand = currentProduct + delta;
    if (cand < 1 || cand > 100) {
      cand = 1 + Math.floor(Math.random() * 100);
    }
    values.add(cand);
  }

  const list = Array.from(values);
  shuffleArray(list);

  const row1 = document.createElement('div');
  row1.className = 'answers-row';
  const row2 = document.createElement('div');
  row2.className = 'answers-row';

  list.forEach((val, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-answer';
    btn.textContent = val.toString();
    btn.dataset.value = val.toString();

    btn.addEventListener('pointerdown', pointerStart);
    btn.addEventListener('pointermove', pointerMove);
    btn.addEventListener('pointerup',   pointerEnd);
    btn.addEventListener('pointercancel', pointerEnd);

    if (idx < 5) {
      row1.appendChild(btn);
    } else {
      row2.appendChild(btn);
    }
  });

  answersDiv.appendChild(row1);
  answersDiv.appendChild(row2);
}

/* Quizsteuerung */
btnStart.addEventListener('click', () => {
  startQuiz();
});

function startQuiz() {
  totalQuestions = parseInt(sliderEl.value, 10);
  currentQuestionNr = 0;
  correctCount = 0;
  wrongCount   = 0;
  seqIndex     = 0;
  quizRunning  = true;

  statCorrect.textContent = '0';
  statWrong.textContent   = '0';
  statTotal.textContent   = totalQuestions.toString();
  statQuestion.textContent = '0';
  statTime.textContent = '0';

  feedbackEl.textContent = '';
  feedbackEl.className = '';
  finishedEl.style.display = 'none';
  finishedEl.textContent = '';

  startScreen.style.display = 'none';
  gameScreen.style.display  = 'block';

  if (timerId) clearInterval(timerId);
  startTime = Date.now();
  timerId = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    statTime.textContent = s.toString();
  }, 500);

  nextQuestion();
}

function nextQuestion() {
  currentQuestionNr++;
  if (currentQuestionNr > totalQuestions) {
    endQuiz();
    return;
  }

  statQuestion.textContent = currentQuestionNr.toString();
  generateQuestion();
  questionEl.innerHTML = `Was ist <strong>${currentA} × ${currentB}</strong> ?`;
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  dropzoneEl.classList.add('empty-text');

  buildAnswerButtons();
}

function endQuiz() {
  quizRunning = false;
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }

  questionEl.textContent = 'Fertig!';
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  dropzoneEl.classList.add('empty-text');

  const total = correctCount + wrongCount;
  const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const timeSec = parseInt(statTime.textContent, 10) || 0;

  let msg = `Du hast ${correctCount} von ${total} Aufgaben richtig (${pct} %).`;
  if (timeSec > 0) {
    msg += ` Zeit: ${timeSec} Sekunden.`;
  }

  if (pct === 100)      msg += ' Perfekt, alle richtig!';
  else if (pct >= 80)   msg += ' Sehr gut!';
  else if (pct >= 60)   msg += ' Gut – noch etwas üben.';
  else                  msg += ' Weiter üben lohnt sich!';

  finishedEl.style.display = 'block';
  finishedEl.innerHTML = `<strong>${msg}</strong>`;
}

/* Drag & Drop wie im Quadratzahlen-Quiz */
let ghost = null;
let dragValue = null;

function pointerStart(e) {
  const btn = e.currentTarget;
  dragValue = parseInt(btn.dataset.value, 10);

  ghost = btn.cloneNode(true);
  ghost.classList.add('drag-ghost');
  document.body.appendChild(ghost);

  ghost.style.left = e.clientX + 'px';
  ghost.style.top  = e.clientY + 'px';

  btn.setPointerCapture(e.pointerId);
}

function pointerMove(e) {
  if (!ghost) return;
  ghost.style.left = e.clientX + 'px';
  ghost.style.top  = e.clientY + 'px';
}

function pointerEnd(e) {
  if (!ghost) return;

  const r = dropzoneEl.getBoundingClientRect();
  const inside =
    e.clientX >= r.left &&
    e.clientX <= r.right &&
    e.clientY >= r.top &&
    e.clientY <= r.bottom;

  if (inside && dragValue != null) {
    handleDrop(dragValue);
  }

  ghost.remove();
  ghost = null;
  dragValue = null;

  try { e.target.releasePointerCapture(e.pointerId); } catch(_){}
}

function handleDrop(val) {
  if (!quizRunning) return;

  if (val === currentProduct) {
    correctCount++;
    statCorrect.textContent = correctCount.toString();
    feedbackEl.textContent = 'Richtig!';
    feedbackEl.className = 'success';
    dropzoneEl.classList.remove('empty-text');
  } else {
    wrongCount++;
    statWrong.textContent = wrongCount.toString();
    feedbackEl.textContent = `Nein, richtig ist ${currentProduct}.`;
    feedbackEl.className = 'fail';
    dropzoneEl.classList.remove('empty-text');
  }

  setTimeout(nextQuestion, 1000);
}

/* Initial */
createRowButtons();
updateModeButtons();
anzahlEl.textContent = sliderEl.value;
</script>

</body>
</html>
